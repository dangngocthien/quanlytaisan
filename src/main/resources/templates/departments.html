<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Phòng ban - Hệ thống Quản lý Tài sản</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons (Optional) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet" />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark"
      style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
    >
      <div class="container-fluid">
        <span class="navbar-brand fw-bold">
          <i class="fas fa-building"></i> Hệ thống Quản lý Tài sản
        </span>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="/baocao/department-dashboard" th:href="@{/baocao/department-dashboard}">
                  <i class="fas fa-chart-pie"></i> Dashboard
                </a>
              </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                href="/phong-ban"
                th:href="@{/phong-ban}"
              >
                <i class="fas fa-door-open"></i> Phòng ban
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/tai-san" th:href="@{/tai-san}">
                <i class="fas fa-cube"></i> Tài sản
              </a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <i class="fas fa-chart-bar"></i> Báo cáo
              </a>
              <ul
                class="dropdown-menu dropdown-menu-end"
                aria-labelledby="navbarDropdown"
              >
                <li>
                  <a class="dropdown-item" th:href="@{/baocao/valuation}"
                    >Báo cáo Định giá</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/baocao/depreciation}"
                    >Báo cáo Khấu hao</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid py-5">
      <div class="row">
        <div class="col-12">
          <!-- Header -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">
              <i class="fas fa-list"></i> Danh sách Phòng ban
            </h1>
            <button class="btn btn-success" id="addNewDepartmentBtn">
              <i class="fas fa-plus"></i> Thêm phòng ban mới
            </button>
          </div>

          <!-- Departments Table Card -->
          <div class="card shadow-sm">
            <div class="card-body p-0">
              <!-- Empty State -->
              <div
                th:if="${departments == null or departments.isEmpty()}"
                class="text-center py-5"
              >
                <i class="fas fa-inbox text-muted" style="font-size: 3rem"></i>
                <p class="text-muted mt-3">Không có dữ liệu phòng ban</p>
              </div>

              <!-- Departments Table -->
              <div th:unless="${departments == null or departments.isEmpty()}">
                <table class="table table-hover table-striped mb-0">
                  <thead style="background-color: #f8f9fa">
                    <tr>
                      <th width="5%" class="text-center">STT</th>
                      <th width="15%">Mã Phòng</th>
                      <th width="30%">Tên Phòng</th>
                      <th width="35%">Mô tả</th>
                      <th width="15%" class="text-center">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:each="dept, stat : ${departments}">
                      <td
                        class="text-center fw-semibold text-muted"
                        th:text="${stat.count}"
                      ></td>
                      <td>
                        <span
                          class="badge bg-info"
                          th:text="${dept.code}"
                        ></span>
                      </td>
                      <td>
                        <strong th:text="${dept.name}"></strong>
                      </td>
                      <td>
                        <span
                          class="description"
                          th:title="${dept.description}"
                          th:text="${dept.description != null ? dept.description : 'N/A'}"
                        ></span>
                      </td>
                      <td class="text-center">
                        <button
                          class="btn btn-sm btn-warning edit-btn"
                          th:data-id="${dept.id}"
                          title="Sửa"
                        >
                          <i class="fas fa-edit"></i>
                        </button>
                        <button
                          class="btn btn-sm btn-danger delete-btn"
                          th:data-id="${dept.id}"
                          title="Xóa"
                        >
                          <i class="fas fa-trash"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Footer -->
            <div class="card-footer bg-light">
              <small class="text-muted">
                <i class="fas fa-info-circle"></i>
                Tổng số phòng ban:
                <strong
                  th:text="${departments != null ? departments.size() : 0}"
                ></strong>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2026 - Hệ thống Quản lý Tài sản | Nhóm 18</p>
    </footer>

    <!-- =========== MODAL THÊM/SỬA PHÒNG BAN =========== -->
    <div
      class="modal fade"
      id="departmentModal"
      tabindex="-1"
      aria-labelledby="modalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <!-- MODAL HEADER -->
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="modalTitle">Thêm Phòng ban mới</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <!-- MODAL BODY -->
          <div class="modal-body">
            <form id="departmentForm">
              <!-- Input ẩn để lưu ID phòng ban (nếu là Sửa) -->
              <input type="hidden" id="departmentId" />

              <!-- Mã Phòng -->
              <div class="mb-3">
                <label for="code" class="form-label">
                  <i class="fas fa-barcode"></i> Mã Phòng
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="code"
                  placeholder="Nhập mã phòng (VD: IT, HR, ...)"
                  required
                />
              </div>

              <!-- Tên Phòng -->
              <div class="mb-3">
                <label for="name" class="form-label">
                  <i class="fas fa-building"></i> Tên Phòng
                  <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  placeholder="Nhập tên phòng (VD: Phòng Công nghệ thông tin, ...)"
                  required
                />
              </div>

              <!-- Mô tả -->
              <div class="mb-3">
                <label for="description" class="form-label">
                  <i class="fas fa-align-left"></i> Mô tả
                </label>
                <textarea
                  class="form-control"
                  id="description"
                  rows="4"
                  placeholder="Nhập mô tả về phòng ban (tùy chọn)"
                ></textarea>
              </div>
            </form>
          </div>

          <!-- MODAL FOOTER -->
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              id="closeDepartmentBtn"
              data-bs-dismiss="modal"
            >
              <i class="fas fa-times"></i> Hủy
            </button>
            <button
              type="button"
              class="btn btn-primary"
              id="saveDepartmentBtn"
            >
              <i class="fas fa-save"></i> Lưu
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- =========== KẾT THÚC MODAL =========== -->

    <!-- Bootstrap 5 JS Bundle (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Set Context Path sử dụng Thymeleaf (TRƯỚC khi load department.js) -->
    <script th:inline="javascript">
      // Lấy context path từ server (được truyền từ Controller)
      window.contextPath = /*[[${contextPath}]]*/ "";
      console.log("Context Path:", window.contextPath);
    </script>

    <!-- Custom JS for Department Operations -->
    <script th:src="@{/js/department.js}"></script>

    <!-- Custom JS -->
    <script>
      // Bạn có thể thêm JavaScript cho các tính năng tương tác ở đây
      document.addEventListener("DOMContentLoaded", function () {
        console.log("Trang danh sách phòng ban đã load thành công");
      });
    </script>
  </body>
</html>
